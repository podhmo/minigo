# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

# A new push to the same PR cancels the superseded run; pushes to main
# always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # the M1-4 budget step needs the merge base's budgets.go
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Test
      run: make test

    - name: Strict-lazy conformance (M4-8b)
      run: go test -run 'TestStrictLazy|TestDeferFacts' . ./compile

    - name: Spike counters (C1 invariant)
      run: make test-spike

    - name: Internal import graph (archcheck)
      run: make archcheck

    - name: Similarity ratchet (simcheck)
      run: |
        GOTOOLCHAIN=auto go install github.com/Songmu/gosimilarity/cmd/gosimilarity@298b2cd
        # the pinned gosimilarity wants a newer toolchain than go.mod's;
        # auto lets go fetch it just for the tool build.
        make simcheck

    - name: File budgets vs merge base (M1-4)
      if: github.event_name == 'pull_request'
      run: |
        base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
        git show "$base:internal/archcheck/budgets.go" > /tmp/base_budgets.go
        go run ./internal/cmd/archcheck -budget-base /tmp/base_budgets.go

  race-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Test with the race detector
      run: make test-race

  e2e-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: E2E Test
      run: make -C examples/convert-define e2e

    - name: Check toolchains
      run: make -C examples/convert-define check-toolchains
